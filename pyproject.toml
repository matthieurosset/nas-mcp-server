[project]
name = "nas-mcp-server"
version = "1.0.0"
description = "MCP server for Plex, Radarr, and Overseerr"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Matthieu Rosset" }
]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nas-mcp-server = "nas_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nas_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]
